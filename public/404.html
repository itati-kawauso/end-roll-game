<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE END ROLLER - 404</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // If someone accesses a subpath, redirect back to root preserving query params
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
    <style>
      body {
        margin: 0;
        background: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      a {
        color: #38bdf8;
        margin-top: 16px;
        text-decoration: none;
        border: 1px solid #38bdf8;
        padding: 8px 16px;
        border-radius: 4px;
        font-size: 14px;
      }
      a:hover {
        background: rgba(56, 189, 248, 0.1);
      }
    </style>
  </head>
  <body>
    <h1>404 - フィルム未検出</h1>
    <p>指定されたリールは見つかりませんでした。メインシアターへ戻ります...</p>
    <a href="./">エンドロールへ戻る (Return to Main)</a>
  </body>
</html>
