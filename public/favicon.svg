<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="filmGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#888888" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <!-- Background Cinema Reel Frame -->
  <rect width="64" height="64" rx="14" fill="#050505" stroke="#262626" stroke-width="2"/>
  
  <!-- Film Sprocket holes -->
  <rect x="6" y="8" width="6" height="8" rx="2" fill="#333"/>
  <rect x="6" y="20" width="6" height="8" rx="2" fill="#333"/>
  <rect x="6" y="32" width="6" height="8" rx="2" fill="#333"/>
  <rect x="6" y="44" width="6" height="8" rx="2" fill="#333"/>
  
  <rect x="52" y="8" width="6" height="8" rx="2" fill="#333"/>
  <rect x="52" y="20" width="6" height="8" rx="2" fill="#333"/>
  <rect x="52" y="32" width="6" height="8" rx="2" fill="#333"/>
  <rect x="52" y="44" width="6" height="8" rx="2" fill="#333"/>

  <!-- Screen projector area -->
  <rect x="16" y="10" width="32" height="44" rx="4" fill="#121212" stroke="#404040" stroke-width="1.5"/>

  <!-- Rolling Credit Lines -->
  <line x1="20" y1="18" x2="44" y2="18" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="24" x2="40" y2="24" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="30" x2="42" y2="30" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Invader / Clapper Triangle Element -->
  <polygon points="28,42 36,37 36,47" fill="#38bdf8"/>
  <circle cx="41" cy="42" r="2" fill="#f43f5e"/>
</svg>
